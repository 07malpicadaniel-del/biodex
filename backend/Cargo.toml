[package]
name = "biodex-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Axum + PostGIS API server for BioDex capture validation, taxonomy lookup, and card minting."

[lints]
workspace = true

[[bin]]
name = "biodex-backend"
path = "src/main.rs"

[[bin]]
name = "sync-geozones"
path = "src/bin/sync_geozones.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
biodex-core = { path = "../core-engine" }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
p256 = { version = "0.13", default-features = false, features = ["std", "ecdsa", "pkcs8", "sha256"] }
tower = { version = "0.5", features = ["util"] }
